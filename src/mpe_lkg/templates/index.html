<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Local Llama Knowledge Graph</title>
    <script src="{{ url_for('static', filename='vendor/marked.umd.js') }}"></script>
    <script src="{{ url_for('static', filename='vendor/purify.min.js') }}"></script>
    <script src="{{ url_for('static', filename='vendor/vis-network.min.js') }}"></script>
    <style>
        body { font-family: Arial, sans-serif; line-height: 1.6; padding: 20px; }
        #query { width: 100%; padding: 10px; margin-bottom: 10px; box-sizing: border-box; }
        button { padding: 10px 20px; margin-right: 8px; }
        button[disabled] { opacity: .5; cursor: not-allowed; }
        .step, .final-answer, .similar-item { margin-bottom: 20px; border: 1px solid #ddd; padding: 10px; }
        #sums { margin: 6px 0; font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
                font-size: 12px; color: #444; display: flex; flex-wrap: wrap; gap: 6px; }
        #sums b { font-weight: 600; color: #666; font-family: inherit; }
        #sums span { background: #eef6ee; border: 1px solid #cfe3cf; border-radius: 3px;
                     padding: 1px 5px; }
        .step h3, .final-answer h3, .similar-item h3 { margin-top: 0; }
        #container { display: flex; flex-wrap: wrap; gap: 20px; }
        #left-panel { flex: 1 1 380px; min-width: 0; }
        /* The reasoning column grows without bound, so pin the graph in view
           instead of letting it scroll away after the first few steps. */
        #graph { flex: 1 1 380px; height: 600px; border: 1px solid #ddd;
                 position: sticky; top: 20px; align-self: flex-start; }
        .strongest-path { background: #f0f0f0; padding: 10px; margin-top: 10px; }
        .error-box { border: 1px solid #c0392b; background: #fdecea; color: #7b1f16;
                     padding: 12px 14px; margin-bottom: 20px; border-radius: 4px; }
        .error-box h3 { margin: 0 0 6px; }
        .error-box pre { white-space: pre-wrap; margin: 6px 0 0; font-size: 13px; }
        .notice { color: #7a5c00; background: #fff6d8; border: 1px solid #e0c356;
                  padding: 6px 10px; margin-top: 8px; font-size: 13px; }
        #status { color: #666; font-size: 13px; min-height: 1.4em; margin-bottom: 10px; }

        /* Progress. A determinate bar would be a lie -- the number of steps is not
           known in advance -- so it fills toward a soft ceiling and stops claiming
           anything the moment the run ends. */
        #progress { margin: 8px 0 4px; }
        #progress-bar { height: 4px; background: #eceae4; border-radius: 2px; overflow: hidden; }
        #progress-bar span { display: block; height: 100%; width: 0; background: #2a78d6;
                             transition: width .45s ease-out; }
        #progress[data-state="done"] #progress-bar span { background: #008300; }
        #progress[data-state="error"] #progress-bar span { background: #c0392b; }
        #progress[data-state="idle"] #progress-bar { visibility: hidden; }

        /* Collapsed summary: question, then how much thinking, then the answer. */
        .thinking-toggle { display: block; width: 100%; text-align: left; margin: 0 0 20px;
            padding: 9px 12px; border: 1px solid #ddd; background: #f7f6f3; border-radius: 4px;
            cursor: pointer; font: inherit; color: #52514e; }
        .thinking-toggle:hover { background: #efeee9; }
        .thinking-toggle b { color: #0b0b0b; }
        #steps[hidden] { display: none; }
        .step[data-focus="true"] { border-color: #2a78d6; box-shadow: 0 0 0 3px rgba(42,120,214,.14); }
        .step-close { float: right; border: none; background: none; cursor: pointer;
            font-size: 18px; line-height: 1; color: #7a7975; padding: 0 2px; margin: 0; }
        .step-close:hover { color: #0b0b0b; }
        #models { display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
                  font-size: 13px; color: #52514e; margin: 8px 0 4px; }
        #models label { display: flex; align-items: center; gap: 5px; }
        #models select { font: inherit; padding: 3px 6px; }
        .setup { border: 1px solid #e0c356; background: #fff6d8; padding: 12px 14px;
                 border-radius: 4px; margin-bottom: 14px; }
        .setup h3 { margin: 0 0 6px; font-size: 15px; }
        .setup table { border-collapse: collapse; margin: 8px 0; font-size: 13px; }
        .setup td { padding: 3px 12px 3px 0; }
        .setup code { background: rgba(0,0,0,.06); padding: 1px 5px; border-radius: 3px; }
        .setup button { padding: 4px 10px; font-size: 13px; margin: 0; }
        .pull-progress { font-size: 13px; color: #52514e; margin-top: 8px; }
        .pull-bar { height: 6px; background: rgba(0,0,0,.1); border-radius: 3px; overflow: hidden; margin-top: 4px; }
        .pull-bar span { display: block; height: 100%; background: #2a78d6; width: 0; transition: width .2s; }
    </style>
</head>
<body>
    <h1>Local Llama Knowledge Graph</h1>
    <p>This application uses a local Llama model to answer queries, build embeddings, and create a
       knowledge graph for exploring related questions and answers.</p>

    <input type="text" id="query" placeholder="e.g., What is the capital of France?">
    <button id="submit">Submit</button>
    <button id="download-img">Download PNG</button>
    <div id="models"></div>
    <div id="progress" data-state="idle"><div id="progress-bar"><span></span></div></div>
    <div id="status"></div>
    <!-- Sums an exact evaluator settled. Worth showing: it is the one part of the
         run the model did not decide, and a reader can check it at a glance. -->
    <div id="sums" hidden></div>

    <div id="container">
        <div id="left-panel">
            <div id="setup"></div>
            <div id="errors"></div>
            <div id="response">
                <div id="thinking" hidden></div>
                <div id="steps"></div>
                <div id="answer"></div>
            </div>
            <div id="similar"></div>
        </div>
        <div id="graph"></div>
    </div>

    <script>
        const query = document.getElementById('query');
        const submit = document.getElementById('submit');
        const downloadBtn = document.getElementById('download-img');
        const response = document.getElementById('response');
        const thinking = document.getElementById('thinking');
        const steps = document.getElementById('steps');
        const answer = document.getElementById('answer');
        const progress = document.getElementById('progress');
        const progressBar = progress.querySelector('span');
        const similar = document.getElementById('similar');
        const errors = document.getElementById('errors');
        const status = document.getElementById('status');
        const sums = document.getElementById('sums');
        const seenSums = new Set();
        const graphContainer = document.getElementById('graph');

        let network;
        let nodes = new vis.DataSet();
        let edges = new vis.DataSet();
        // Only one stream may be open at a time. The previous version left the old
        // EventSource running when you submitted again, so two reasoning runs raced
        // into the same panel.
        let eventSource = null;
        let stepCount = 0;

        function initGraph() {
            network = new vis.Network(graphContainer, { nodes, edges }, {
                // A white halo on the label keeps it readable where it crosses an edge.
                nodes: { shape: 'dot', size: 30, borderWidth: 2,
                         font: { size: 12, color: '#000', strokeWidth: 4, strokeColor: '#ffffff' } },
                edges: {
                    width: 2,
                    font: { size: 12, align: 'middle', strokeWidth: 3, strokeColor: '#ffffff' },
                    color: { inherit: 'both' },
                    smooth: { type: 'continuous' },
                    scaling: { min: 1, max: 5, label: { enabled: true, min: 14, max: 30 } }
                },
                physics: {
                    solver: 'forceAtlas2Based',
                    // avoidOverlap at full strength: the complaint the layout has to
                    // answer is circles sitting on top of each other, and the edge
                    // lengths now leave room for the solver to honour it.
                    forceAtlas2Based: { springLength: 260, avoidOverlap: 1, gravitationalConstant: -140 },
                    stabilization: { iterations: 300 }
                }
            });
            // Fitting during an update captures a half-settled layout, which leaves the
            // graph as a tight clump in the middle of the canvas. Fit once it has come
            // to rest instead -- and raise the zoom ceiling, because fit() refuses to
            // magnify past 100% by default and a handful of nodes then sits in a
            // corner of a mostly empty canvas.
            network.on('stabilized', () => {
                network.fit({ animation: false, maxZoomLevel: 3 });
                // AND STOP. stabilization.iterations only bounds the opening solve;
                // afterwards the solver keeps running, and on a graph where every
                // node is joined to every other by a similarity edge it never
                // reaches equilibrium -- so the whole thing drifts, slowly, forever,
                // long after the answer is written. Freezing on stabilised is the
                // difference between a diagram and an aquarium.
                network.setOptions({ physics: { enabled: false } });
            });

            // Hover: show where the reasoning walked to reach this step.
            network.on('hoverNode', (params) => highlightPath(params.node));
            network.on('blurNode', () => highlightPath(null));
            // Click: open the log at that step.
            network.on('click', (params) => {
                if (params.nodes.length) focusStep(params.nodes[0]);
            });
        }
        initGraph();

        function renderMarkdown(text) {
            // The content is model-generated and lands in innerHTML, so it is sanitised.
            return DOMPurify.sanitize(marked.parse(text || ''));
        }

        function showError(message, hint) {
            const box = document.createElement('div');
            box.className = 'error-box';
            box.innerHTML = '<h3></h3><pre></pre>';
            box.querySelector('h3').textContent = message;
            box.querySelector('pre').textContent = hint || '';
            errors.appendChild(box);
        }

        function setBusy(busy) {
            submit.disabled = busy;
            submit.textContent = busy ? 'Thinking…' : 'Submit';
        }

        function displayStrongestPath(path, weights, avgSimilarity) {
            if (!path || path.length < 2) return '<p>No valid path found.</p>';
            let html = '<h4>Strongest Path:</h4><ul>';
            for (let i = 0; i < path.length - 1; i++) {
                html += `<li>${path[i]} &rarr; ${path[i + 1]} (Similarity: ${weights[i].toFixed(4)})</li>`;
            }
            html += `</ul><p>Overall Path Similarity (geometric mean): ${avgSimilarity.toFixed(4)}</p>`;
            return html;
        }

        // Green: settled by an exact evaluator. Deliberately distinct from the blue
        // of an embedding similarity, because the two are not the same kind of
        // statement and a reader should never have to guess which is which.
        const EXACT = { border: '#2e7d32', background: '#a5d6a7',
                        highlight: { border: '#1b5e20', background: '#81c784' } };

        function addExactConversion(data) {
            const parsed = /^(\S+)\s+(\w+)\s*=\s*(\S+)\s+(\w+)$/.exec(data.result || '');
            if (!parsed) return;
            const [, fromValue, fromUnit, toValue, toUnit] = parsed;
            [fromUnit, toUnit].forEach(unit => {
                const id = 'unit:' + unit;
                if (!nodes.get(id)) {
                    nodes.add({ id, label: unit, shape: 'box', color: EXACT,
                                font: { size: 12 }, title: 'unit' });
                }
            });
            const id = `conv:${fromUnit}:${toUnit}`;
            if (!edges.get(id)) {
                edges.add({ id, from: 'unit:' + fromUnit, to: 'unit:' + toUnit,
                            label: `${fromValue} = ${toValue}`, color: { color: '#2e7d32' },
                            width: 2, length: 220, dashes: false,
                            title: `exact: ${data.result}` });
            }
            // Tie it to the step that asked, so the two graphs are one picture.
            linkToStep(data.step, 'unit:' + fromUnit, 'asked');
            if (network) network.setOptions({ physics: { enabled: true } });
        }

        function addExactSum(data) {
            const id = `calc:${data.step}:${data.expression}`;
            if (nodes.get(id)) return;
            nodes.add({ id, label: `${data.expression} = ${data.value}`, shape: 'box',
                        color: EXACT, font: { size: 11 }, title: 'settled exactly' });
            linkToStep(data.step, id, 'computed');
            if (network) network.setOptions({ physics: { enabled: true } });
        }

        // A calc or convert event arrives BEFORE the step event it belongs to --
        // the loop settles the arithmetic and only then emits the step. So a link
        // whose step node does not exist yet is remembered and attached when it
        // appears, rather than dropped.
        let pendingLinks = [];

        function linkToStep(stepNumber, nodeId, label) {
            const stepId = 'Step' + stepNumber;
            if (!nodes.get(stepId)) { pendingLinks.push({ stepId, nodeId, label }); return; }
            const id = `link:${stepId}:${nodeId}`;
            if (edges.get(id)) return;
            edges.add({ id, from: stepId, to: nodeId, label,
                        color: { color: '#81c784' }, width: 1, length: 200,
                        dashes: [4, 4], font: { size: 10, color: '#2e7d32' } });
        }

        function attachPending() {
            const waiting = pendingLinks;
            pendingLinks = [];
            waiting.forEach(({ stepId, nodeId, label }) => {
                if (!nodes.get(stepId) || !nodes.get(nodeId)) {
                    pendingLinks.push({ stepId, nodeId, label });
                    return;
                }
                const id = `link:${stepId}:${nodeId}`;
                if (!edges.get(id)) {
                    edges.add({ id, from: stepId, to: nodeId, label,
                                color: { color: '#81c784' }, width: 1, length: 200,
                                dashes: [4, 4], font: { size: 10, color: '#2e7d32' } });
                }
            });
        }

        function updateGraph(graphData) {
            // New nodes need the solver back: it switched itself off when the
            // previous layout settled, and switches off again on 'stabilized'.
            if (network) network.setOptions({ physics: { enabled: true } });
            const incoming = new Set(graphData.nodes.map(n => n.id));
            graphData.nodes.forEach(node => {
                if (nodes.get(node.id)) { nodes.update(node); } else { nodes.add(node); }
            });
            // The exact graph is built in the browser from calc and convert events,
            // so it is not in the server's payload -- and pruning by that payload
            // deleted every green node the instant it was added. Anything the
            // browser owns is kept.
            const mine = id => /^(unit:|calc:)/.test(String(id));
            nodes.getIds().filter(id => !incoming.has(id) && !mine(id))
                 .forEach(id => nodes.remove(id));
            const exactEdges = edges.get({ filter: e => /^(conv:|link:)/.test(String(e.id)) });
            edges.clear();
            edges.add(graphData.edges);
            edges.add(exactEdges);
            attachPending();
            network.fit();
        }

        function appendPanel(className, heading, data) {
            const div = document.createElement('div');
            div.className = className;
            // The node id the backend uses, so a click on the graph can find this
            // panel by lookup instead of by counting.
            if (data.step) div.id = `step-${data.step}`;

            const h = document.createElement('h3');
            h.textContent = heading;
            div.appendChild(h);
            const body = document.createElement('div');
            body.innerHTML = renderMarkdown(data.content);
            div.appendChild(body);
            if (data.truncated) {
                const note = document.createElement('div');
                note.className = 'notice';
                note.textContent = 'This step was shortened: the model kept answering past the length limit.';
                div.appendChild(note);
            }
            // A single node has no path; saying "No valid path found" there reads as
            // a failure when it is just the first step.
            if (data.path_data && data.path_data.strongest_path.length > 1) {
                const pathDiv = document.createElement('div');
                pathDiv.className = 'strongest-path';
                pathDiv.innerHTML = displayStrongestPath(
                    data.path_data.strongest_path, data.path_data.path_weights, data.path_data.avg_similarity);
                div.appendChild(pathDiv);
            }
            (className === 'step' ? steps : answer).appendChild(div);
        }

        /* ---- progress ---------------------------------------------------------- */

        function setProgress(state, fraction) {
            progress.dataset.state = state;
            if (fraction !== undefined) {
                progressBar.style.width = `${Math.min(100, fraction * 100).toFixed(1)}%`;
            }
        }

        function stepProgress(n) {
            // How many steps a run takes is not known in advance, so a determinate
            // bar would be inventing a denominator. This approaches a ceiling
            // instead: visible movement per step, never a false "almost done".
            setProgress('running', 1 - Math.pow(0.78, n));
        }

        /* ---- collapse the thinking once the run is over ------------------------ */

        function collapseThinking(count) {
            if (!count) return;
            thinking.hidden = false;
            thinking.innerHTML = '';
            const button = document.createElement('button');
            button.className = 'thinking-toggle';
            button.type = 'button';
            const label = (expanded) =>
                `${expanded ? '▾' : '▸'} <b>${count} thinking step${count === 1 ? '' : 's'}</b>`
                + ` — click to ${expanded ? 'hide' : 'show'}`;
            button.innerHTML = label(false);
            button.setAttribute('aria-expanded', 'false');
            steps.hidden = true;

            button.addEventListener('click', () => {
                const expanded = steps.hidden;
                steps.hidden = !expanded;
                button.innerHTML = label(expanded);
                button.setAttribute('aria-expanded', String(expanded));
            });
            thinking.appendChild(button);
        }

        function expandThinking() {
            const button = thinking.querySelector('.thinking-toggle');
            if (button && steps.hidden) button.click();
        }

        /* ---- graph <-> log ----------------------------------------------------- */

        function focusStep(nodeId) {
            // Node ids are "Step3"; the panels are "step-3".
            const n = String(nodeId).replace(/^Step/, '');
            expandThinking();
            const panel = document.getElementById(`step-${n}`)
                       || answer.querySelector('.final-answer');
            if (!panel) return;

            steps.querySelectorAll('[data-focus]').forEach(el => el.removeAttribute('data-focus'));
            panel.dataset.focus = 'true';
            panel.scrollIntoView({ behavior: 'smooth', block: 'center' });

            if (!panel.querySelector('.step-close')) {
                const close = document.createElement('button');
                close.className = 'step-close';
                close.type = 'button';
                close.title = 'Collapse the thinking again';
                close.textContent = '×';
                close.addEventListener('click', (e) => {
                    e.stopPropagation();
                    panel.removeAttribute('data-focus');
                    close.remove();
                    const button = thinking.querySelector('.thinking-toggle');
                    if (button && !steps.hidden) button.click();
                });
                panel.querySelector('h3').appendChild(close);
            }
        }

        function pathTo(nodeId) {
            // Where the reasoning walked to get here: follow the strongest incoming
            // edge back to the start. Cheap, and it is the same notion of "strongest"
            // the server already draws.
            const seen = new Set([nodeId]);
            const walk = [nodeId];
            let current = nodeId;
            for (let guard = 0; guard < 64; guard++) {
                const incoming = edges.get({
                    filter: e => (e.to === current || e.from === current)
                });
                let best = null;
                for (const edge of incoming) {
                    const other = edge.to === current ? edge.from : edge.to;
                    if (seen.has(other)) continue;
                    // Only walk backwards, toward earlier steps.
                    if (Number(String(other).replace(/^Step/, '')) >= Number(String(current).replace(/^Step/, ''))) continue;
                    if (!best || edge.value > best.value) best = { other, value: edge.value };
                }
                if (!best) break;
                seen.add(best.other);
                walk.push(best.other);
                current = best.other;
            }
            return walk;
        }

        function highlightPath(nodeId) {
            const onPath = new Set(nodeId ? pathTo(nodeId) : []);
            nodes.update(nodes.get().map(n => ({
                id: n.id,
                borderWidth: onPath.has(n.id) ? 4 : 2,
                color: onPath.has(n.id)
                    ? { border: '#eb6834', background: '#f7b799' }
                    : null   // null restores the default palette
            })));
        }

        function run() {
            const userQuery = query.value.trim();
            if (!userQuery) return;

            if (eventSource) { eventSource.close(); eventSource = null; }
            thinking.innerHTML = '';
            thinking.hidden = true;
            steps.innerHTML = '';
            steps.hidden = false;
            answer.innerHTML = '';
            similar.innerHTML = '';
            errors.innerHTML = '';
            sums.hidden = true;
            sums.innerHTML = '';
            seenSums.clear();
            pendingLinks = [];
            nodes.clear();
            edges.clear();
            setBusy(true);
            stepCount = 0;
            setProgress('running', 0.06);
            status.textContent = 'Connecting to the model…';

            eventSource = new EventSource(`/query?query=${encodeURIComponent(userQuery)}`);

            eventSource.onmessage = (event) => {
                const data = JSON.parse(event.data);

                if (data.type === 'step') {
                    stepCount = data.step;
                    stepProgress(data.step);
                    status.textContent = `Step ${data.step}: ${data.title}`;
                    appendPanel('step', `Step ${data.step}: ${data.title}`, data);
                    if (data.graph) updateGraph(data.graph);

                } else if (data.type === 'final') {
                    setProgress('running', 0.97);
                    status.textContent = 'Writing the final answer…';
                    appendPanel('final-answer', 'Final Answer', data);
                    if (data.graph) updateGraph(data.graph);

                } else if (data.type === 'convert') {
                    // The hard graph. A conversion is a fact about two units, so it
                    // draws as two unit nodes and an edge between them -- the same
                    // shape as the soft graph, in a colour that says it is a
                    // different kind of claim. Blue is measured similarity and has
                    // no truth value; green is derived from exact ratios.
                    addExactConversion(data);

                } else if (data.type === 'calc') {
                    addExactSum(data);
                    // Deliberately not deduplicated away entirely: a repeated sum
                    // means the model re-derived it, which is worth seeing. But the
                    // same expression twice adds nothing, so it is shown once.
                    if (!seenSums.has(data.expression)) {
                        seenSums.add(data.expression);
                        if (sums.hidden) { sums.hidden = false; sums.innerHTML = '<b>Exact:</b>'; }
                        const chip = document.createElement('span');
                        chip.textContent = `${data.expression} = ${data.value}`;
                        chip.title = `Evaluated exactly at step ${data.step}`;
                        sums.appendChild(chip);
                    }

                } else if (data.type === 'similar') {
                    similar.innerHTML = '';
                    if (!data.items.length) return;
                    const heading = document.createElement('h2');
                    heading.textContent = `Related Questions and Answers (${data.store_size} stored)`;
                    similar.appendChild(heading);
                    data.items.forEach(item => {
                        const div = document.createElement('div');
                        div.className = 'similar-item';
                        const h = document.createElement('h3');
                        h.textContent = `${item.is_question ? 'Question' : 'Answer'} `
                                      + `(Similarity: ${item.similarity.toFixed(4)})`;
                        const p = document.createElement('p');
                        p.textContent = item.text;
                        div.appendChild(h);
                        div.appendChild(p);
                        similar.appendChild(div);
                    });

                } else if (data.type === 'error') {
                    showError(data.message, data.hint);
                    setProgress('error', 1);
                    status.textContent = '';

                } else if (data.type === 'done') {
                    const model = data.embedding ? `${data.embedding.model} (${data.embedding.dim}d)` : 'unknown';
                    status.textContent = `Done in ${data.total_time.toFixed(1)}s · `
                                       + `${data.steps} steps · embeddings: ${model}`;
                    // Question and answer stay in view; the reasoning folds away into
                    // a single line you can open when you want it.
                    collapseThinking(data.steps || stepCount);

                } else if (data.type === 'done_stream') {
                    setBusy(false);
                    if (progress.dataset.state !== 'error') setProgress('done', 1);
                    eventSource.close();
                    eventSource = null;
                }
            };

            eventSource.onerror = () => {
                // EventSource retries silently by default, so say something and stop.
                if (eventSource) { eventSource.close(); eventSource = null; }
                setBusy(false);
                status.textContent = '';
                showError('Lost the connection to the server.',
                          'Check that the app is still running, then try again. '
                        + 'Visit /health to see whether Ollama is reachable.');
            };
        }

        submit.addEventListener('click', run);
        query.addEventListener('keydown', (e) => { if (e.key === 'Enter') run(); });

        // ---- model selection -------------------------------------------------
        // Which model answers is the first thing a new user gets wrong, so it is
        // shown and changeable here rather than only through an environment
        // variable they have to read the README to discover.
        const modelsBar = document.getElementById('models');
        const setup = document.getElementById('setup');

        function picker(id, label, options, selected) {
            if (!options.length) return '';
            const opts = options.map(name =>
                `<option value="${name}"${name === selected ? ' selected' : ''}>${name}</option>`).join('');
            return `<label>${label} <select id="${id}">${opts}</select></label>`;
        }

        async function loadModels() {
            let data;
            try {
                data = await (await fetch('/models')).json();
            } catch {
                modelsBar.textContent = 'Could not reach the server.';
                return;
            }

            modelsBar.innerHTML =
                picker('pick-chat', 'Chat model', data.chat, data.selected.chat) +
                picker('pick-embed', 'Embeddings', data.embedding, data.selected.embedding);

            for (const [id, key] of [['pick-chat', 'chat'], ['pick-embed', 'embedding']]) {
                const el = document.getElementById(id);
                if (!el) continue;
                el.addEventListener('change', async () => {
                    await fetch('/models', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ [key]: el.value })
                    });
                    status.textContent = `Now using ${el.value}.`;
                });
            }

            setup.innerHTML = '';
            if (!data.chat.length) showSetup(data);
        }

        function showSetup(data) {
            // Nothing usable is installed. Say what to get, how big it is, and offer
            // to fetch it -- rather than printing a command and leaving.
            const rows = data.suggested.map(m => `
                <tr>
                  <td><code>${m.name}</code></td>
                  <td>${m.size}</td>
                  <td>${m.role} — ${m.note}</td>
                  <td><button class="get" data-model="${m.name}">Get</button></td>
                </tr>`).join('');

            setup.innerHTML = `
                <div class="setup">
                  <h3>No chat model installed yet</h3>
                  <p>This app talks to <a href="https://ollama.com" target="_blank"
                     rel="noopener">Ollama</a> on <code>${data.ollama_url}</code>. Pick one to download,
                     or run <code>ollama pull &lt;name&gt;</code> yourself.</p>
                  <table>${rows}</table>
                  <div class="pull-progress" hidden>
                    <span class="pull-text"></span>
                    <div class="pull-bar"><span></span></div>
                  </div>
                </div>`;

            setup.querySelectorAll('.get').forEach(btn =>
                btn.addEventListener('click', () => pullModel(btn.dataset.model, btn)));
        }

        function pullModel(name, button) {
            const box = setup.querySelector('.pull-progress');
            const text = box.querySelector('.pull-text');
            const bar = box.querySelector('.pull-bar span');
            box.hidden = false;
            setup.querySelectorAll('.get').forEach(b => { b.disabled = true; });
            text.textContent = `Starting ${name}…`;

            // A plain fetch with a reader: EventSource cannot POST, and the model
            // name has to be in a body the server can validate against its allowlist.
            fetch('/pull', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ model: name })
            }).then(async (response) => {
                const reader = response.body.getReader();
                const decoder = new TextDecoder();
                let buffer = '';
                for (;;) {
                    const { done, value } = await reader.read();
                    if (done) break;
                    buffer += decoder.decode(value, { stream: true });
                    const blocks = buffer.split('\n\n');
                    buffer = blocks.pop();
                    for (const block of blocks) {
                        const line = block.split('\n').find(l => l.startsWith('data: '));
                        if (!line) continue;
                        const event = JSON.parse(line.slice(6));
                        if (event.type === 'error') {
                            text.textContent = event.message;
                            setup.querySelectorAll('.get').forEach(b => { b.disabled = false; });
                            return;
                        }
                        if (event.type === 'pull_done') {
                            text.textContent = `${name} is ready.`;
                            bar.style.width = '100%';
                            loadModels();
                            return;
                        }
                        text.textContent = `${name}: ${event.status || 'working'}`;
                        if (event.total) {
                            bar.style.width = `${((event.completed || 0) / event.total * 100).toFixed(1)}%`;
                        }
                    }
                }
            }).catch(err => {
                text.textContent = `Download failed: ${err}`;
                setup.querySelectorAll('.get').forEach(b => { b.disabled = false; });
            });
        }

        loadModels();

        downloadBtn.addEventListener('click', () => {
            // Export what is actually on screen. vis.js already draws to a canvas, so
            // reading that canvas gives the user their own layout -- re-plotting the
            // graph server-side would hand back a different picture than the one
            // they are looking at.
            const canvas = graphContainer.querySelector('canvas');
            if (!canvas) return;
            const composed = document.createElement('canvas');
            composed.width = canvas.width;
            composed.height = canvas.height;
            const ctx = composed.getContext('2d');
            ctx.fillStyle = '#ffffff';           // canvas is transparent; PNG needs a ground
            ctx.fillRect(0, 0, composed.width, composed.height);
            ctx.drawImage(canvas, 0, 0);
            composed.toBlob((blob) => {
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = 'knowledge-graph.png';
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(url);
            }, 'image/png');
        });
    </script>
</body>
</html>
