name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Install browser for the render tests
        run: python -m playwright install chromium --only-shell --with-deps

      # One gate: lint, tests and the documented numbers pass together. Keeping
      # check_numbers as a separate optional target is how a README drifts away
      # from what the code actually does.
      - name: Lint
        run: python -m ruff check .

      - name: Test
        run: python -m pytest tests/ -q -m "not ollama"

      - name: Check documented numbers
        run: python scripts/check_numbers.py
